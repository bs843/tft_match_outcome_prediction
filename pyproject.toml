[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-msc-pipeline"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests==2.34.2",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.2",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "xgboost==3.0.2",
  "lightgbm==4.6.0",
  "catboost==1.2.8",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
