analysis_contract_version: "1.0.1"
release:
  required_analysis_tag: tft-patch17.8-analysis-contract-v2
  required_analysis_commit: resolve_from_required_analysis_tag
  require_annotated_tag: true
  require_clean_worktree: true
  release_manifest: reports/analysis_contract_releases/analysis_contract_v2.json

dataset:
  collection_run_id: 20260823T124729Z-673b6e6c
  required_dataset_version: tft_set17_patch17_8_v11
  required_schema_version: "1.3.2"
  required_collection_tag: tft-patch17.8-final-collection-v10
  expected_matches: 5000
  expected_participants: 40000
  expected_predictors: 291
  collection_manifest: data/manifests/collection_run_20260823T124729Z-673b6e6c.json
  collection_manifest_sha256: 7e49799218dc597d9bc3e0d87af3316a90b9c2445704ee723b1f3698be49fc04
  dataset_manifest: data/manifests/dataset_20260823T124729Z-673b6e6c.json
  dataset_manifest_sha256: e61eb7cd19f3b3e31872200e8b825bcf5d805dd507cdebd9632685b8bd07a3ef
  accepted_manifest_content_sha256: 5f3e67c9eac8bc01c395eb2d80ebdbff3113b124c2f0929b92dd1321b43ff581
  patch: "17.8"

split:
  strategy: chronological_match_group
  grouping_unit: match_hash
  manifest: data/splits/20260823T124729Z-673b6e6c/match_splits_tft_set17_patch17_8_v11.csv
  manifest_file_sha256: 57d59a71ad3d2c3caf8d6beba04434ca8c20eab4e69e9c20be440808afa1d55d
  canonical_assignment_sha256: da64ca53fb584738b9db85c5364fd95644d399fe8202f9ad5b6619f271a95242
  counts: {train: 3500, validation: 750, test: 750}
  proportions: {train: 0.70, validation: 0.15, test: 0.15}
  participant_rows_per_match: 8
  legacy_80_20_production_allowed: false

configuration:
  experiments_file: analysis/configs/experiments.yaml
  experiments_sha256: 7d6c5fe51c4a20154cc6e9ba734bc464012cf59721138a82941b84dd9b47d48d
  columns_file: analysis/configs/columns.yaml
  columns_sha256: afe61718d74e691d3593a8cfb6bbfcd72dcef072eeea08bd6ae55198ea5e619a

seeds:
  master_seed: 4275
  python: 4275
  numpy: 4275
  scikit_learn: 4275
  cross_validation: 4275
  xgboost: 4275
  lightgbm: 4275
  catboost: 4275
  resampling: 4275

targets:
  top4:
    role: primary_binary_classification
    field: top4
    derivation: placement <= 4
    labels: [0, 1]
    primary_metric: f1
    secondary_metrics: [accuracy, precision, recall, roc_auc, pr_auc, confusion_matrix]
  placement:
    role: secondary_exact_multiclass
    field: placement
    derivation: validated final placement
    labels: [1, 2, 3, 4, 5, 6, 7, 8]
    primary_metric: mae
    secondary_metrics: [accuracy, macro_f1, weighted_f1]
  grouped_placement:
    enabled: false
    reason: not_selected_in_existing_analysis_design

features:
  primary_family: F5
  families:
    F1: [basic]
    F2: [basic, units]
    F3: [basic, units, traits]
    F4: [basic, units, traits, items]
    F5: [basic, units, traits, items, structure]
  excluded_families: [rank_snapshot, identifiers, targets, audit_metadata, progression, timestamps]
  required_exact_by_group:
    basic: [level, composition_size]
    structure: [structure__unique_units, structure__mean_star, structure__max_star, structure__two_star_units, structure__three_star_units, structure__total_items, structure__unique_items, structure__active_traits, structure__trait_strength_total]
  allowed_dynamic_prefixes: [unit_presence__, unit_star__, trait_presence__, trait_strength__, item_count__]
  vocabulary_fit_partition: train
  minimum_category_frequency: 5
  unseen_category_policy: ignore_no_new_column
  missing_value_policy: fill_numeric_zero
  categorical_encoding: deterministic_train_vocabulary_count_and_presence
  numerical_preprocessing: numeric_float_no_imputation_after_zero_fill
  scaling: none
  feature_selection: frozen_family_and_train_frequency_threshold_only
  prohibit_rank_snapshot_prefix: true

models:
  primary_registry:
    dummy: {class: sklearn.dummy.DummyClassifier, parameters: {strategy: prior}}
    logistic_regression: {class: sklearn.linear_model.LogisticRegression, parameters: {max_iter: 2000}}
    random_forest: {class: sklearn.ensemble.RandomForestClassifier, parameters: {n_estimators: 300, min_samples_leaf: 2, n_jobs: 1}}
    xgboost: {class: xgboost.XGBClassifier, parameters: {n_estimators: 300, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, eval_metric: logloss, n_jobs: 1}}
    lightgbm: {class: lightgbm.LGBMClassifier, parameters: {n_estimators: 300, max_depth: -1, learning_rate: 0.05, num_leaves: 31, subsample: 0.8, colsample_bytree: 0.8, n_jobs: 1, deterministic: true, force_col_wise: true, verbosity: -1}}
    catboost: {class: catboost.CatBoostClassifier, parameters: {iterations: 300, depth: 6, learning_rate: 0.05, loss_function: Logloss, verbose: false, allow_writing_files: false, thread_count: 1}}
  secondary_placement_registry:
    dummy: {class: sklearn.dummy.DummyClassifier, parameters: {strategy: most_frequent}}
    random_forest: {class: sklearn.ensemble.RandomForestClassifier, parameters: {n_estimators: 300, min_samples_leaf: 2, n_jobs: 1}}
  decision_tree:
    enabled: false
    reason: not_in_existing_approved_registry
  hyperparameter_search: none_fixed_parameters
  class_imbalance: none
  classification_threshold: 0.5

selection:
  train_partition: train
  selection_partition: validation
  primary_task_metric: f1
  tie_break: primary_registry_order
  feature_family_comparison_partition: validation
  refit_after_selection: train_plus_validation
  early_stopping: disabled
  threshold_optimisation: disabled_fixed_0_5

test_access:
  policy: final_evaluation_only_after_selection_manifest_written
  prohibited_uses: [feature_selection, preprocessing_fit, hyperparameter_tuning, model_selection, threshold_optimisation, early_stopping, architecture_selection, exploratory_comparison]
  require_access_timestamp: true
  require_access_record_in_run_manifest: true
  maximum_final_evaluations_per_run: 1

production_artifacts:
  required: [run_manifest.json, provenance.json, artifact_manifest.csv, data/frozen_split_assignments.csv, data/feature_vocabulary.json, modelling/selection_manifest.json, modelling/tables/validation_metrics.csv, modelling/tables/final_test_metrics.csv, modelling/models/selected_top4_f5.joblib]

audit:
  require_input_checksums: true
  require_configuration_hashes: true
  require_split_hash: true
  require_feature_schema_hashes: true
  require_model_parameters: true
  require_validation_metrics: true
  require_test_access_log: true
  allowed_final_statuses: [preflight_failed, development_complete, final_evaluation_complete, failed]
